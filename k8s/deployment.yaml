# ==============================================================
# DEPLOYMENT — ai-infra-benchmark (nai-endpoint-chat)
# ==============================================================
# App demo Streamlit, imagem publicada no Docker Hub em imcx87/appai.
# Uma réplica (o histórico SQLite fica num PVC RWO), sem HPA.
#
# A tag da imagem é atualizada pelo Flux Image Automation (flux/image-automation/)
# através do marcador $imagepolicy abaixo. Sem a automação, fica em :main.
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nai-endpoint-chat
  namespace: appai
  labels:
    app: nai-endpoint-chat
    app.kubernetes.io/name: nai-endpoint-chat
    app.kubernetes.io/part-of: appai
    managed-by: claude-code
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC RWO: o pod novo só sobe depois que o antigo solta o volume
  selector:
    matchLabels:
      app: nai-endpoint-chat
  template:
    metadata:
      labels:
        app: nai-endpoint-chat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001  # torna o PVC gravável pelo usuário não-root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nai-endpoint-chat
          image: imcx87/appai:main # {"$imagepolicy": "flux-system:nai-endpoint-chat"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: APPAI_DATA_DIR
              value: /data
            # Valores iniciais da sidebar (opcional). Descomente para pré-configurar.
            # - name: NAI_API_URL
            #   value: "http://<nai-endpoint>/enterpriseai/v1"
            # - name: VLLM_METRICS_URL
            #   value: "http://<service-do-modelo>.<ns>:8000/metrics"
            # - name: PROMETHEUS_URL
            #   value: "http://prometheus-operated.monitoring:9090"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: appai-data

# Seleciona a imagem mais nova de main pelas tags main-<timestamp>-<sha>,
# geradas pelo workflow do GitHub Actions.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nai-endpoint-chat
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nai-endpoint-chat
  filterTags:
    pattern: '^main-(?P<ts>[0-9]+)-[a-f0-9]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc

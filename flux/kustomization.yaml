# Aplicar no cluster de management (ou workspace) do NKP, no namespace flux-system
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nai-endpoint-chat
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: nai-endpoint-chat
  targetNamespace: appai
